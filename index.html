<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тест: Физическая подготовка ВС РФ 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            background: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            padding: 12px 8px;
            font-size: 14px;
            line-height: 1.4;
            touch-action: manipulation;
        }
        .test-wrapper { max-width: 100%; margin: 0 auto; }
        .test-card {
            background: white;
            border-radius: 24px;
            box-shadow: 0 8px 25px -8px rgba(0, 0, 0, 0.15);
            overflow: hidden;
        }
        .test-header {
            background: #1e3a5f;
            color: white;
            padding: 16px 20px;
        }
        .test-header h1 { font-size: 1.3rem; margin-bottom: 6px; font-weight: 600; }
        .test-header p { opacity: 0.9; font-size: 0.85rem; }
        .quiz-body { padding: 16px 20px; min-height: 300px; }
        .question-progress {
            background: #e9ecef;
            display: inline-block;
            padding: 5px 14px;
            border-radius: 40px;
            font-size: 0.75rem;
            font-weight: 600;
            color: #1e3a5f;
            margin-bottom: 14px;
        }
        .question-text {
            font-size: 1.1rem;
            font-weight: 600;
            line-height: 1.45;
            margin-bottom: 18px;
            color: #0a1c2f;
        }
        .answers-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 20px;
        }
        .answer-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 14px;
            padding: 14px 16px;
            cursor: pointer;
            transition: all 0.15s;
            display: flex;
            align-items: flex-start;
            gap: 12px;
            font-size: 0.95rem;
            min-height: 50px;
            user-select: none;
        }
        .answer-item:active { transform: scale(0.99); }
        .answer-item:hover { background: #f1f5f9; border-color: #94a3b8; }
        .answer-check {
            width: 24px; height: 24px;
            background: white;
            border: 2px solid #cbd5e1;
            border-radius: 6px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.8rem;
            font-weight: bold;
            flex-shrink: 0;
            margin-top: 2px;
        }
        .answer-item.radio-style .answer-check { border-radius: 50%; }
        .answer-item.selected {
            background: #eef2ff;
            border-color: #2563eb;
        }
        .answer-item.selected .answer-check {
            background: #2563eb;
            border-color: #2563eb;
            color: white;
        }
        .match-container {
            display: flex;
            flex-direction: column;
            gap: 16px;
            margin-bottom: 20px;
        }
        .match-col { width: 100%; }
        .match-col h4 {
            margin-bottom: 10px;
            color: #1e3a5f;
            border-bottom: 2px solid #e2e8f0;
            padding-bottom: 6px;
            font-size: 0.9rem;
            font-weight: 600;
        }
        .match-left-item, .match-right-item {
            background: #f8fafc;
            border: 2px solid #e2e8f0;
            border-radius: 12px;
            padding: 12px 14px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: all 0.15s;
            font-size: 0.9rem;
            min-height: 44px;
            display: flex;
            align-items: center;
            user-select: none;
        }
        .match-left-item:active, .match-right-item:active { transform: scale(0.99); }
        .match-left-item.selected, .match-right-item.selected {
            background: #dbeafe;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
        }
        .match-left-item.matched, .match-right-item.matched {
            background: #dcfce7;
            border-color: #22c55e;
            opacity: 0.8;
            cursor: default;
        }
        .match-pairs {
            margin-top: 14px;
            background: #f1f5f9;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 0.85rem;
        }
        .match-pair {
            display: flex;
            justify-content: space-between;
            padding: 8px 0;
            border-bottom: 1px solid #cbd5e1;
            align-items: center;
            gap: 8px;
        }
        .match-pair:last-child { border-bottom: none; }
        .match-pair span:first-child { font-weight: 600; width: 52%; font-size: 0.9rem; }
        .match-pair span:last-child { width: 48%; color: #1e3a5f; text-align: right; font-size: 0.9rem; }
        .remove-pair-btn {
            background: #fef2f2;
            border: none;
            color: #dc2626;
            cursor: pointer;
            font-size: 1.2rem;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin-left: 6px;
            flex-shrink: 0;
        }
        .remove-pair-btn:active { background: #fecaca; }
        .nav-buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 8px;
            position: sticky;
            bottom: 0;
            background: white;
            padding: 12px 0 4px;
            border-top: 1px solid #e2e8f0;
        }
        button {
            background: white;
            border: 2px solid #cbd5e1;
            padding: 14px 20px;
            font-weight: 600;
            font-size: 0.95rem;
            border-radius: 60px;
            cursor: pointer;
            transition: 0.15s;
            color: #1e293b;
            min-height: 50px;
            user-select: none;
            -webkit-user-select: none;
        }
        button:active { transform: scale(0.98); }
        button.primary-btn {
            background: #1e3a5f;
            border-color: #1e3a5f;
            color: white;
        }
        button.primary-btn:active { background: #0f2a48; }
        button:hover:not(.primary-btn) { background: #e2e8f0; }
        button:disabled { opacity: 0.5; cursor: not-allowed; }
        .result-stats {
            font-size: 1.3rem;
            font-weight: 700;
            margin-bottom: 14px;
            text-align: center;
        }
        .question-review {
            background: white;
            border-radius: 14px;
            padding: 14px;
            margin-bottom: 12px;
            border-left: 4px solid #cbd5e1;
        }
        .question-review.correct { border-left-color: #22c55e; }
        .question-review.incorrect { border-left-color: #dc2626; }
        .question-review-header {
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 0.9rem;
        }
        .question-review-header.correct { color: #15803d; }
        .question-review-header.incorrect { color: #dc2626; }
        .question-review-text {
            margin-bottom: 10px;
            font-size: 0.9rem;
            color: #1e293b;
            line-height: 1.4;
        }
        .answer-review {
            padding: 8px 12px;
            margin: 4px 0;
            border-radius: 10px;
            font-size: 0.85rem;
            line-height: 1.3;
        }
        .answer-review.user {
            background: #f1f5f9;
            border-left: 3px solid #64748b;
        }
        .answer-review.user.correct {
            background: #dcfce7;
            border-left-color: #22c55e;
        }
        .answer-review.user.incorrect {
            background: #fef2f2;
            border-left-color: #dc2626;
        }
        .answer-review.correct-answer {
            background: #f0fdf4;
            border-left: 3px solid #22c55e;
            color: #15803d;
        }
        .restart-button {
            background: #0f172a;
            color: white;
            border: none;
            width: 100%;
            margin-top: 16px;
            padding: 14px;
            font-size: 0.95rem;
            border-radius: 60px;
            min-height: 50px;
        }
        .footer-note {
            text-align: center;
            font-size: 0.7rem;
            color: #475569;
            padding: 14px 20px 20px;
            border-top: 1px solid #e2e8f0;
            line-height: 1.3;
        }
        @media (max-width: 480px) {
            body { padding: 8px 4px; font-size: 13px; }
            .test-card { border-radius: 20px; }
            .test-header { padding: 14px 16px; }
            .test-header h1 { font-size: 1.2rem; }
            .quiz-body { padding: 14px 16px; }
            .question-text { font-size: 1.05rem; }
            .answer-item { padding: 12px 14px; font-size: 0.9rem; min-height: 48px; }
            .match-left-item, .match-right-item { padding: 10px 12px; font-size: 0.85rem; min-height: 42px; }
            .match-pair span:first-child, .match-pair span:last-child { font-size: 0.85rem; }
            button { padding: 12px 16px; font-size: 0.9rem; min-height: 46px; }
            .nav-buttons { padding: 10px 0 2px; gap: 8px; }
        }
        .answer-item, .match-left-item, .match-right-item, button {
            -webkit-touch-callout: none;
            -webkit-user-select: none;
            -khtml-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
        }
        .loading {
            text-align: center;
            padding: 40px;
            color: #64748b;
        }
    </style>
</head>

    function shuffleArray(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function prepareQuestion(originalQ) {
        if (originalQ.type === "match") {
            const leftShuffled = shuffleArray([...originalQ.left]);
            const rightShuffled = shuffleArray([...originalQ.right]);
            return {
                text: originalQ.text,
                type: "match",
                left: leftShuffled,
                right: rightShuffled,
                correctPairs: originalQ.correctPairs,
                userPairs: []
            };
        } else {
            const shuffledOpts = shuffleArray([...originalQ.options]);
            return {
                text: originalQ.text,
                correct: [...originalQ.correct],
                options: shuffledOpts,
                type: originalQ.type,
                userAnswers: originalQ.type === "single" ? null : []
            };
        }
    }

    function generateTest() {
        return QUESTION_BANK.map(q => prepareQuestion(q));
    }

    let currentTest = [];
    let currentIndex = 0;
    let quizFinished = false;
    const container = document.getElementById('quizDynamicContent');
    let matchSelectedLeft = null;

    function isQuestionCorrect(question) {
        if (question.type === "single") {
            return question.userAnswers === question.correct[0];
        } else if (question.type === "multi") {
            const userSet = new Set(question.userAnswers);
            const correctSet = new Set(question.correct);
            if (userSet.size !== correctSet.size) return false;
            for (let item of correctSet) if (!userSet.has(item)) return false;
            return true;
        } else if (question.type === "match") {
            if (question.userPairs.length !== question.correctPairs.length) return false;
            const sortedUser = [...question.userPairs].sort((a,b) => a[0].localeCompare(b[0]));
            const sortedCorrect = [...question.correctPairs].sort((a,b) => a[0].localeCompare(b[0]));
            return JSON.stringify(sortedUser) === JSON.stringify(sortedCorrect);
        }
        return false;
    }

    function handleMatchSelect(question, side, value) {
        if (side === 'left') {
            matchSelectedLeft = value;
        } else if (side === 'right') {
            if (matchSelectedLeft !== null) {
                const already = question.userPairs.some(p => p[0] === matchSelectedLeft);
                if (!already) {
                    question.userPairs.push([matchSelectedLeft, value]);
                }
                matchSelectedLeft = null;
            }
        }
        render();
    }

    function removeMatchPair(question, leftVal) {
        question.userPairs = question.userPairs.filter(p => p[0] !== leftVal);
        render();
    }

    function render() {
        if (quizFinished) {
            renderResults();
        } else {
            renderQuestion();
        }
    }

    function renderQuestion() {
        if (!currentTest.length || currentIndex >= currentTest.length) return;
        const q = currentTest[currentIndex];
        const total = currentTest.length;
        const qNum = currentIndex + 1;

        if (q.type === "match") {
            let leftHtml = '';
            q.left.forEach(leftVal => {
                const matchedPair = q.userPairs.find(p => p[0] === leftVal);
                const isMatched = !!matchedPair;
                const selectedClass = (matchSelectedLeft === leftVal) ? 'selected' : '';
                leftHtml += `<div class="match-left-item ${selectedClass} ${isMatched ? 'matched' : ''}" data-left="${escapeHtml(leftVal)}">${escapeHtml(leftVal)}${isMatched ? ' → ' + escapeHtml(matchedPair[1]) : ''}</div>`;
            });
            let rightHtml = '';
            q.right.forEach(rightVal => {
                const isMatched = q.userPairs.some(p => p[1] === rightVal);
                rightHtml += `<div class="match-right-item ${isMatched ? 'matched' : ''}" data-right="${escapeHtml(rightVal)}">${escapeHtml(rightVal)}${isMatched ? ' ✓' : ''}</div>`;
            });
            let pairsHtml = '<div class="match-pairs"><strong>✅ Составленные пары:</strong>';
            if (q.userPairs.length === 0) {
                pairsHtml += '<div style="color:#64748b;font-style:italic">Пока нет пар</div>';
            } else {
                q.userPairs.forEach(pair => {
                    pairsHtml += `<div class="match-pair"><span>${escapeHtml(pair[0])}</span><span>→ ${escapeHtml(pair[1])}<button class="remove-pair-btn" data-left="${escapeHtml(pair[0])}">✖</button></span></div>`;
                });
            }
            pairsHtml += '</div>';

            const html = `
                <div class="quiz-body">
                    <div class="question-progress">Вопрос ${qNum} из ${total} (сопоставление)</div>
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    <div class="match-container">
                        <div class="match-col"><h4>📌 Левая колонка</h4>${leftHtml}</div>
                        <div class="match-col"><h4>🔗 Правая колонка</h4>${rightHtml}</div>
                    </div>
                    ${pairsHtml}
                    <div class="nav-buttons">
                        <button id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="nextBtn" class="primary-btn">${currentIndex === total-1 ? 'Завершить тест' : 'Далее ▶'}</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;

            document.querySelectorAll('.match-left-item').forEach(el => {
                if (!el.classList.contains('matched')) {
                    el.addEventListener('click', () => {
                        matchSelectedLeft = el.getAttribute('data-left');
                        render();
                    });
                }
            });
            document.querySelectorAll('.match-right-item').forEach(el => {
                if (!el.classList.contains('matched')) {
                    el.addEventListener('click', () => {
                        handleMatchSelect(q, 'right', el.getAttribute('data-right'));
                    });
                }
            });
            document.querySelectorAll('.remove-pair-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    e.stopPropagation();
                    removeMatchPair(q, btn.getAttribute('data-left'));
                });
            });
            document.getElementById('prevBtn')?.addEventListener('click', () => {
                if (currentIndex > 0) { currentIndex--; matchSelectedLeft = null; render(); }
            });
            document.getElementById('nextBtn')?.addEventListener('click', () => {
                if (currentIndex === total-1) finishTest();
                else { currentIndex++; matchSelectedLeft = null; render(); }
            });
        } else {
            let answersHtml = '';
            q.options.forEach(opt => {
                let isSelected = false;
                if (q.type === 'single') isSelected = (q.userAnswers === opt);
                else isSelected = q.userAnswers.includes(opt);
                const selectedClass = isSelected ? 'selected' : '';
                answersHtml += `<div class="answer-item ${q.type === 'single' ? 'radio-style' : ''} ${selectedClass}" data-answer="${escapeHtml(opt)}">
                    <div class="answer-check">${q.type === 'single' ? '○' : '✓'}</div>
                    <div class="answer-text">${escapeHtml(opt)}</div>
                </div>`;
            });
            const html = `
                <div class="quiz-body">
                    <div class="question-progress">Вопрос ${qNum} из ${total}</div>
                    <div class="question-text">${escapeHtml(q.text)}</div>
                    <div class="answers-area" id="answersArea">${answersHtml}</div>
                    <div class="nav-buttons">
                        <button id="prevBtn" ${currentIndex === 0 ? 'disabled' : ''}>◀ Назад</button>
                        <button id="nextBtn" class="primary-btn">${currentIndex === total-1 ? 'Завершить тест' : 'Далее ▶'}</button>
                    </div>
                </div>
            `;
            container.innerHTML = html;
            document.querySelectorAll('.answer-item').forEach(div => {
                div.addEventListener('click', () => {
                    const answerVal = div.getAttribute('data-answer');
                    if (q.type === 'single') q.userAnswers = answerVal;
                    else {
                        const idx = q.userAnswers.indexOf(answerVal);
                        if (idx === -1) q.userAnswers.push(answerVal);
                        else q.userAnswers.splice(idx, 1);
                    }
                    render();
                });
            });
            document.getElementById('prevBtn')?.addEventListener('click', () => {
                if (currentIndex > 0) { currentIndex--; render(); }
            });
            document.getElementById('nextBtn')?.addEventListener('click', () => {
                if (q.type === 'single' && q.userAnswers === null) { alert('Выберите ответ'); return; }
                if (q.type === 'multi' && q.userAnswers.length === 0) { alert('Выберите хотя бы один вариант'); return; }
                if (currentIndex === total-1) finishTest();
                else { currentIndex++; render(); }
            });
        }
    }

    function finishTest() { quizFinished = true; render(); }

    function renderResults() {
        let correctCount = 0;
        const reviews = [];
        
        for (let i = 0; i < currentTest.length; i++) {
            const q = currentTest[i];
            const isCorrect = isQuestionCorrect(q);
            if (isCorrect) correctCount++;
            
            let userAnswerStr = '';
            let correctAnswerStr = '';
            
            if (q.type === 'single') {
                userAnswerStr = q.userAnswers || 'Не выбран';
                correctAnswerStr = q.correct[0];
            } else if (q.type === 'multi') {
                userAnswerStr = q.userAnswers.length ? q.userAnswers.join(', ') : 'Не выбрано';
                correctAnswerStr = q.correct.join(', ');
            } else if (q.type === 'match') {
                userAnswerStr = q.userPairs.map(p => `${p[0]} → ${p[1]}`).join('; ') || 'Нет пар';
                correctAnswerStr = q.correctPairs.map(p => `${p[0]} → ${p[1]}`).join('; ');
            }
            
            reviews.push({
                question: q.text,
                isCorrect,
                userAnswer: userAnswerStr,
                correctAnswer: correctAnswerStr,
                type: q.type
            });
        }
        
        const wrongCount = currentTest.length - correctCount;
        
        let reviewsHtml = '';
        reviews.forEach((r, idx) => {
            const statusClass = r.isCorrect ? 'correct' : 'incorrect';
            const statusIcon = r.isCorrect ? '✅' : '❌';
            const statusText = r.isCorrect ? 'Верно' : 'Ошибка';
            
            reviewsHtml += `
                <div class="question-review ${statusClass}">
                    <div class="question-review-header ${statusClass}">
                        <span>${statusIcon}</span>
                        <span>Вопрос ${idx + 1}: ${statusText}</span>
                    </div>
                    <div class="question-review-text">${escapeHtml(r.question)}</div>
                    <div class="answer-review user ${r.isCorrect ? 'correct' : 'incorrect'}">
                        <strong>Ваш ответ:</strong> ${escapeHtml(r.userAnswer)}
                    </div>
                    ${!r.isCorrect ? `<div class="answer-review correct-answer"><strong>Правильный ответ:</strong> ${escapeHtml(r.correctAnswer)}</div>` : ''}
                </div>
            `;
        });
        
        const resultHtml = `
            <div class="quiz-body">
                <div class="result-stats">📊 Результат: ${correctCount} / ${currentTest.length} (${Math.round(correctCount/currentTest.length*100)}%)</div>
                <div style="text-align:center;margin-bottom:16px;">✔️ Верно: ${correctCount} | ❌ Неверно: ${wrongCount}</div>
                <div style="margin-top:16px;"><strong>📋 Разбор всех вопросов:</strong></div>
                ${reviewsHtml}
                <button id="restartBtn" class="restart-button">🔄 Пройти тест заново</button>
            </div>
        `;
        container.innerHTML = resultHtml;
        document.getElementById('restartBtn')?.addEventListener('click', resetAndRestart);
    }

    function resetAndRestart() {
        currentTest = generateTest();
        currentIndex = 0;
        quizFinished = false;
        matchSelectedLeft = null;
        render();
    }

    function escapeHtml(str) {
        if (!str) return '';
        return str.replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
    }

    function init() {
        try {
            if (!container) {
                console.error('Контейнер #quizDynamicContent не найден!');
                return;
            }
            currentTest = generateTest();
            currentIndex = 0;
            quizFinished = false;
            matchSelectedLeft = null;
            render();
            console.log('Тест успешно загружен. Вопросов:', currentTest.length);
        } catch (error) {
            console.error('Ошибка при инициализации теста:', error);
            container.innerHTML = `<div class="loading" style="color:#dc2626">Ошибка загрузки теста. Обновите страницу.</div>`;
        }
    }

    // Запуск теста
    init();
});
</script>
</body>
</html>
