let currentTest = [];

let quizFinished = false;
let matchSelectedLeft = null;

function shuffleArray(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

function prepareQuestion(originalQ) {
    if (originalQ.type === "match") {
        return {
            text: originalQ.text,
            type: "match",
            left: shuffleArray([...originalQ.left]),
            right: shuffleArray([...originalQ.right]),
            correctPairs: originalQ.correctPairs,
            userPairs: []
        };
    } else {
        return {
            text: originalQ.text,
            correct: [...originalQ.correct],
            options: shuffleArray([...originalQ.options]),
            type: originalQ.type,
            userAnswers: originalQ.type === "single" ? null : []
        };
    }
}

function generateTest() {
    return QUESTION_BANK.map(q => prepareQuestion(q));
}

function isQuestionCorrect(question) {
    if (question.type === "single") {
        return question.userAnswers === question.correct[0];
    } else if (question.type === "multi") {
        const userSet = new Set(question.userAnswers);
        const correctSet = new Set(question.correct);
        if (userSet.size !== correctSet.size) return false;
        for (let item of correctSet) if (!userSet.has(item)) return false;
        return true;
    } else if (question.type === "match") {
        if (question.userPairs.length !== question.correctPairs.length) return false;
        const sortedUser = [...question.userPairs].sort();
        const sortedCorrect = [...question.correctPairs].sort();
        return JSON.stringify(sortedUser) === JSON.stringify(sortedCorrect);
    }
    return false;
}

function handleMatchSelect(question, side, value) {
    if (side === 'left') {
        matchSelectedLeft = value;
    } else if (side === 'right' && matchSelectedLeft !== null) {
        const already = question.userPairs.some(p => p[0] === matchSelectedLeft);
        if (!already) question.userPairs.push([matchSelectedLeft, value]);
        matchSelectedLeft = null;
    }
    render();
}

function removeMatchPair(question, leftVal) {
    question.userPairs = question.userPairs.filter(p => p[0] !== leftVal);
    render();
}

function render() {
    const container = document.getElementById('quizDynamicContent');
    if (!container) {
        console.error('Container not found!');
        return;
    }
    
    if (quizFinished) {
        renderResults(container);
    } else {
        renderQuestion(container);
    }
}

function renderQuestion(container) {
    if (!currentTest.length || currentIndex >= currentTest.length) return;
    const q = currentTest[currentIndex];
    const total = currentTest.length;
    const qNum = currentIndex + 1;

    if (q.type === "match") {
        let html = `<div class="quiz-body">
            <div class="question-progress">Вопрос ${qNum} из ${total} (сопоставление)</div>
            <div class="question-text">${q.text}</div>
            <div class="match-container">
                <div class="match-col"><h4>Левая колонка</h4>`;
        
        q.left.forEach(leftVal => {
            const matched = q.userPairs.find(p => p[0] === leftVal);
            const selected = matchSelectedLeft === leftVal ? 'selected' : '';
            const matchedClass = matched ? 'matched' : '';
            html += `<div class="match-left-item ${selected} ${matchedClass}" onclick="selectLeft('${leftVal.replace(/'/g, "\\'")}')">${leftVal}${matched ? ' → ' + matched[1] : ''}</div>`;
        });
        
        html += `</div><div class="match-col"><h4>Правая колонка</h4>`;
        
        q.right.forEach(rightVal => {
            const isMatched = q.userPairs.some(p => p[1] === rightVal);
            html += `<div class="match-right-item ${isMatched ? 'matched' : ''}" onclick="selectRight('${rightVal.replace(/'/g, "\\'")}')">${rightVal}</div>`;
        });
        
        html += `</div></div><div class="match-pairs"><strong>Пары:</strong> `;
        q.userPairs.forEach(pair => {
            html += `<div>${pair[0]} → ${pair[1]} <button class="remove-pair-btn" onclick="removePair('${pair[0].replace(/'/g, "\\'")}')">✖</button></div>`;
        });
        html += `</div><div class="nav-buttons">
            <button ${currentIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()">◀ Назад</button>
            <button class="primary-btn" onclick="nextQuestion()">${currentIndex === total-1 ? 'Завершить' : 'Далее ▶'}</button>
        </div></div>`;
        
        container.innerHTML = html;
    } else {
        let html = `<div class="quiz-body">
            <div class="question-progress">Вопрос ${qNum} из ${total}</div>
            <div class="question-text">${q.text}</div>
            <div class="answers-area">`;
        
        q.options.forEach(opt => {
            const isSelected = q.type === 'single' ? q.userAnswers === opt : q.userAnswers.includes(opt);
            const selectedClass = isSelected ? 'selected' : '';
            html += `<div class="answer-item ${q.type === 'single' ? 'radio-style' : ''} ${selectedClass}" onclick="selectAnswer('${opt.replace(/'/g, "\\'")}')">
                <div class="answer-check">${q.type === 'single' ? '○' : '✓'}</div>
                <div>${opt}</div>
            </div>`;
        });
        
        html += `</div><div class="nav-buttons">
            <button ${currentIndex === 0 ? 'disabled' : ''} onclick="prevQuestion()">◀ Назад</button>
            <button class="primary-btn" onclick="nextQuestion()">${currentIndex === total-1 ? 'Завершить' : 'Далее ▶'}</button>
        </div></div>`;
        
        container.innerHTML = html;
    }
}

function selectAnswer(answer) {
    const q = currentTest[currentIndex];
    if (q.type === 'single') {
        q.userAnswers = answer;
    } else {
        const idx = q.userAnswers.indexOf(answer);
        if (idx === -1) q.userAnswers.push(answer);
        else q.userAnswers.splice(idx, 1);
    }
    render();
}

function selectLeft(val) {
    matchSelectedLeft = val;
    render();
}

function selectRight(val) {
    handleMatchSelect(currentTest[currentIndex], 'right', val);
}

function removePair(val) {
    removeMatchPair(currentTest[currentIndex], val);
}

function prevQuestion() {
    if (currentIndex > 0) {
        currentIndex--;
        matchSelectedLeft = null;
        render();
    }
}

function nextQuestion() {
    const q = currentTest[currentIndex];
    if (q.type === 'single' && !q.userAnswers) {
        alert('Выберите ответ');
        return;
    }
    if (q.type === 'multi' && q.userAnswers.length === 0) {
        alert('Выберите хотя бы один вариант');
        return;
    }
    
    if (currentIndex === currentTest.length - 1) {
        finishTest();
    } else {
        currentIndex++;
        matchSelectedLeft = null;
        render();
    }
}

function finishTest() {
    quizFinished = true;
    render();
}

function renderResults(container) {
    let correctCount = 0;
    let html = `<div class="quiz-body"><div class="result-stats">📊 Результат</div>`;
    
    currentTest.forEach((q, i) => {
        const isCorrect = isQuestionCorrect(q);
        if (isCorrect) correctCount++;
        
        let userAnswer = '';
        if (q.type === 'single') userAnswer = q.userAnswers || 'Не выбран';
        else if (q.type === 'multi') userAnswer = q.userAnswers.join(', ') || 'Не выбрано';
        else userAnswer = q.userPairs.map(p => `${p[0]}→${p[1]}`).join('; ') || 'Нет пар';
        
        const correctAnswer = q.type === 'match' 
            ? q.correctPairs.map(p => `${p[0]}→${p[1]}`).join('; ')
            : q.correct.join(', ');
        
        html += `<div class="question-review ${isCorrect ? 'correct' : 'incorrect'}">
            <strong>Вопрос ${i+1}:</strong> ${q.text}<br>
            <div class="answer-review user ${isCorrect ? 'correct' : 'incorrect'}">Ваш ответ: ${userAnswer}</div>
            ${!isCorrect ? `<div class="answer-review correct-answer">Правильно: ${correctAnswer}</div>` : ''}
        </div>`;
    });
    
    const percentage = Math.round(correctCount / currentTest.length * 100);
    html += `<div style="text-align:center;margin:20px 0;">
        <div style="font-size:1.5rem;font-weight:bold;">${correctCount} из ${currentTest.length} (${percentage}%)</div>
    </div>
    <button class="restart-button" onclick="restartTest()">🔄 Пройти заново</button></div>`;
    
    container.innerHTML = html;
}

function restartTest() {
    currentTest = generateTest();
    currentIndex = 0;
    quizFinished = false;
    matchSelectedLeft = null;
    render();
}

function startTest() {
    try {
        console.log('Starting test...');
        currentTest = generateTest();
        console.log('Generated', currentTest.length, 'questions');
        currentIndex = 0;
        quizFinished = false;
        matchSelectedLeft = null;
        render();
    } catch (error) {
        console.error('Error starting test:', error);
        document.getElementById('quizDynamicContent').innerHTML = 
            `<div class="error-message">Ошибка: ${error.message}<br>Откройте консоль (F12) для деталей</div>`;
    }
}

// Make functions global for onclick handlers
window.selectAnswer = selectAnswer;
window.selectLeft = selectLeft;
window.selectRight = selectRight;
window.removePair = removePair;
window.prevQuestion = prevQuestion;
window.nextQuestion = nextQuestion;
window.startTest = startTest;
window.restartTest = restartTest;

// Auto-start when page loads
window.addEventListener('load', function() {
    console.log('Page loaded, starting test...');
    setTimeout(startTest, 100);
});
</script>
</body>
</html>
